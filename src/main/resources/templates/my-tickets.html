<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My tickets | SSIMP</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #222;
            padding: 20px;
        }

        main {
            max-width: 1000px;
            margin: 20px auto;
            padding: 24px;
            background: white;
            border-radius: 8px;
        }

        nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        a {
            color: #1769d2;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            vertical-align: top;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f3f4f6;
        }

        .ticket-title {
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <main>
        <nav>
            <nav>
    <a th:href="@{/}">Home</a> |
    <a th:href="@{/user/tickets}">My tickets</a>
</nav>
            <a th:href="@{/user/tickets/new}">Submit a ticket</a>
        </nav>

        <h1>My tickets</h1>

        <p th:if="${#lists.isEmpty(tickets)}">
            You have not submitted any tickets yet.
        </p>

        <div class="table-container"
             th:unless="${#lists.isEmpty(tickets)}">
            <table>
                <thead>
                    <tr>
                        <th scope="col">Ticket number</th>
                        <th scope="col">Title</th>
                        <th scope="col">Category</th>
                        <th scope="col">Priority</th>
                        <th scope="col">Status</th>
                        <th scope="col">Submitted</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ticket : ${tickets}">
                        <td th:text="${ticket.ticketId}"></td>
                        <td class="ticket-title">
    <a th:href="@{/user/tickets/{ticketId}(ticketId=${ticket.ticketId})}"
       th:text="${ticket.title}"></a>
</td>
                        <td th:text="${ticket.category.name}"></td>
                        <td th:text="${ticket.priority}"></td>
                        <td th:text="${#strings.replace(ticket.status, '_', ' ')}"></td>
                        <td th:text="${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
