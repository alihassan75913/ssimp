<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket details | SSIMP</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #222;
            padding: 20px;
        }

        main {
            max-width: 800px;
            margin: 20px auto;
            padding: 24px;
            background: white;
            border-radius: 8px;
        }

        nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        a {
            color: #1769d2;
        }

        h1 {
            overflow-wrap: anywhere;
        }

        dt {
            font-weight: bold;
            margin-top: 16px;
        }

        dd {
            margin: 4px 0 0;
        }

        .description {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            padding: 16px;
            background: #f3f4f6;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <main>
        <nav>
            <a th:href="@{/user/tickets}">My tickets</a>
            <a th:href="@{/user/tickets/new}">Submit a ticket</a>
        </nav>

        <p>Ticket number: <span th:text="${ticket.ticketId}"></span></p>
        <h1 th:text="${ticket.title}"></h1>

        <dl>
            <dt>Category</dt>
            <dd th:text="${ticket.category.name}"></dd>

            <dt>Priority</dt>
            <dd th:text="${ticket.priority}"></dd>

            <dt>Status</dt>
            <dd th:text="${#strings.replace(ticket.status, '_', ' ')}"></dd>

            <dt>Submitted</dt>
            <dd th:text="${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')}"></dd>

            <dt>Last updated</dt>
            <dd th:text="${#temporals.format(ticket.updatedAt, 'yyyy-MM-dd HH:mm')}"></dd>
        </dl>

        <h2>Description</h2>
        <p class="description" th:text="${ticket.description}"></p>
    </main>
</body>
</html>
