<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account | SSIMP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 24px;
        }

        main {
            max-width: 420px;
            margin: 24px auto;
            padding: 24px;
            background: white;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 16px;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 6px;
        }

        button {
            margin-top: 20px;
            background: #1769d2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        a { color: #1769d2; }
        .error { color: #b42318; }
        .success { color: #166534; }
    </style>
</head>
<body>
    <main>
        <h1>SSIMP</h1>
        <h2>Create an account</h2>

        <p class="success"
           th:if="${param.success != null}"
           role="status">
            Your account has been created. You can sign in below.
        </p>

        <p class="error"
           th:if="${error != null}"
           th:text="${error}"
           role="alert"></p>

        <form th:action="@{/register}" method="post">
            <label for="fullName">Full name</label>
            <input
                type="text"
                id="fullName"
                name="fullName"
                th:value="${fullName}"
                maxlength="100"
                autocomplete="name"
                required>

            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                name="email"
                th:value="${email}"
                maxlength="255"
                autocomplete="email"
                required>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                maxlength="72"
                autocomplete="new-password"
                aria-describedby="password-help"
                required>

            <p id="password-help">Use at least 8 characters.</p>

            <button type="submit">Create account</button>
        </form>

        <p>
            Already have an account?
            <a th:href="@{/login}">Sign in</a>
        </p>
    </main>
</body>
</html>
