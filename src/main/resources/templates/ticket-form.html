<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a ticket | SSIMP</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #222;
            padding: 20px;
        }

        main {
            max-width: 650px;
            margin: 20px auto;
            padding: 24px;
            background: white;
            border-radius: 8px;
        }

        label {
            display: block;
            margin: 18px 0 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font: inherit;
        }

        textarea {
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 10px 18px;
            background: #1769d2;
            color: white;
            border: none;
            border-radius: 4px;
            font: inherit;
            cursor: pointer;
        }

        a {
            color: #1769d2;
        }

        .error {
            color: #b42318;
        }

        .success {
            color: #166534;
        }
        .suggestions {
    margin-top: 16px;
    padding: 16px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 4px;
}

.suggestions h2 {
    margin: 0 0 10px;
    font-size: 18px;
}

.suggestions li {
    margin-bottom: 8px;
}

.suggestions p {
    margin-bottom: 0;
}
    </style>
</head>
<body>
    <main>
        <a th:href="@{/}">Home</a>

        <h1>Submit a ticket</h1>
        <p>Describe the problem you need help with.</p>

        <p th:if="${success != null}"
           th:text="${success}"
           class="success"
           role="status"></p>

        <p th:if="${error != null}"
           th:text="${error}"
           class="error"
           role="alert"></p>

        <form th:action="@{/user/tickets}" method="post">
            <label for="title">Title</label>
            <input type="text"
                   id="title"
                   name="title"
                   th:value="${title}"
                   maxlength="150"
                   required>

            <label for="categoryId">Category</label>
            <select id="categoryId" name="categoryId" required>
                <option value="">Choose a category</option>
                <option th:each="category : ${categories}"
                        th:value="${category.categoryId}"
                        th:text="${category.name}"
                        th:selected="${categoryId == category.categoryId}">
                </option>
            </select>
<div id="suggestions-box" class="suggestions" hidden>
    <h2>Try these steps</h2>

    <ol id="suggestion-list">
        <li th:each="suggestion : ${suggestions}"
            th:attr="data-category-id=${suggestion.category.categoryId}"
            th:text="${suggestion.instruction}"
            hidden>
        </li>
    </ol>

    <p>If the problem continues, submit your ticket below.</p>
</div>
            <label for="priority">Priority</label>
            <select id="priority" name="priority" required>
                <option value="LOW"
                        th:selected="${priority == 'LOW'}">Low</option>
                <option value="NORMAL"
                        th:selected="${priority == 'NORMAL'}">Normal</option>
                <option value="HIGH"
                        th:selected="${priority == 'HIGH'}">High</option>
            </select>

            <label for="description">Description</label>
            <textarea id="description"
                      name="description"
                      rows="6"
                      maxlength="5000"
                      th:text="${description}"
                      required></textarea>

            <button type="submit">Submit ticket</button>
        </form>
    </main>
    <script>
    const categorySelect = document.getElementById("categoryId");
    const suggestionsBox = document.getElementById("suggestions-box");
    const suggestionItems = document.querySelectorAll("#suggestion-list li");

    function updateSuggestions() {
        let hasSuggestions = false;

        suggestionItems.forEach(function (item) {
            const matchesCategory =
                item.dataset.categoryId === categorySelect.value;

            item.hidden = !matchesCategory;

            if (matchesCategory) {
                hasSuggestions = true;
            }
        });

        suggestionsBox.hidden = !hasSuggestions;
    }

    categorySelect.addEventListener("change", updateSuggestions);
    updateSuggestions();
</script>
</body>
</html>
